<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NavTerminal</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="filebar"><button id="fileManagerToggle" class="file-manager-toggle" aria-label="Collapse files" title="[Collapse files - Hide the file manager]">◀</button><input id="filename" value="main.py" aria-label="File name"><div class="file-actions"><label class="button" for="upload" title="[Upload - Add files to the environment]">↑ Upload</label><input id="upload" type="file" multiple hidden><button id="download" title="[Download - Save the current file]">↓ Download</button><button id="save" aria-label="Save to local storage" title="[Save - Store the project in local storage]">💾</button></div></header>
<main><aside class="file-manager" id="fileManager"><div class="file-manager-title">Files</div><div id="fileList"></div></aside><section class="workspace"><section class="editor-panel"><textarea id="editor" spellcheck="false" aria-label="Code editor">print("Hello, world!")

name = input("Your name: ")
print(f"Hello, {name}!")</textarea><div id="preview" class="preview hidden"></div></section><section class="controlbar"><input id="argv" class="argv-input" spellcheck="false" autocomplete="off" placeholder="Arguments - sys.argv()" aria-label="Program arguments" title="[Arguments - Values passed to sys.argv()]"><button id="run" disabled aria-label="Run" title="[Run - Execute the current Python file]">▶</button><button id="clearTerminal" aria-label="Clear" title="[Clear - Remove all terminal output]">🗑</button><button id="terminalToggle" aria-expanded="false" title="[Terminal - Show or hide the terminal]">Terminal</button></section><section class="terminal-panel" id="terminalPanel"><div id="terminal" role="log" aria-live="polite"></div><div class="terminal-input-row"><span id="inputPrompt">›</span><input id="terminalInput" autocomplete="off" spellcheck="false" aria-label="Terminal input" disabled title="[Input - Enter data requested by the running program]"><button id="sendInput" disabled aria-label="Send input" title="[Send - Submit terminal input]">↵</button></div></section></section></main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script><script src="app.js"></script></body></html>
